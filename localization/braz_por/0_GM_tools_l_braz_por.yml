 gm_actions.16.t:0 "Criar uma Construção"
 gm_actions.16.d:0 "Adiciona um dos prédios referenciados á nação. Estados com o decreto 'GM Scope' serão priorizados. Caso não haja estados com o decreto, então um estado aleatório será selecionado."
